le' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="525">while True:</tspan><tspan x="713" y="537.5">  turn += 1</tspan><tspan x="713" y="550">  register_evaluation()</tspan><tspan x="713" y="562.5">  budget.done()?</tspan></text><rect x="573" y="610" width="280" height="84" rx="8" fill="#831843" stroke="#f472b6" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="647.1">Main Loop</tspan><tspan x="713" y="664.6">(while True)</tspan></text><polygon points="713,724 900,806 713,888 526,806" fill="#713f12" stroke="#facc15" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="784.6">Budget</tspan><tspan x="713" y="802.1">done?</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="824">turns ≥ 24 OR cost ≥ $5.00</tspan><tspan x="713" y="836.5">OR stagnation ≥ 16 OR time ≥ 120min</tspan></text><rect x="563" y="918" width="300" height="84" rx="8" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="947.4">state = Render State</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="969.2">Genera prompt con: turn, cost,</tspan><tspan x="713" y="981.8">best, tree, lessons, stagnation</tspan></text><polygon points="713,1032 839.3,1096.5 713,1161 586.7,1096.5" fill="#713f12" stroke="#facc15" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y