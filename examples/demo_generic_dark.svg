 x="713" y="1722.3">Snapshot Workspace</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="1744.2">Copia workspace/ → candidates/{id}/</tspan><tspan x="713" y="1756.8">para historial de cambios</tspan></text><polygon points="713,1807 906,1889 713,1971 520,1889" fill="#713f12" stroke="#facc15" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="1867.6">Tool:</tspan><tspan x="713" y="1885.1">Audit Visual?</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="1907">VLM Gemini: screenshot → score 0-100</tspan><tspan x="713" y="1919.5">+ issues + suggestions</tspan></text><polygon points="713,2001 879.9,2083 713,2165 546.1,2083" fill="#713f12" stroke="#facc15" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="2061.6">Tool:</tspan><tspan x="713" y="2079.1">Audit Page?</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="2101">Validación estática: SEO, A11y,</tspan><tspan x="713" y="2113.5">Perf, Responsive, Best Practices</tspan></text><polygon points="713,2195 864.4,2277 713,2359 561.6,2277" fill="#713f12" stroke="#facc15" stroke-width="2"/><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="14" fill="#f1f3f5"><tspan x="713" y="2255.6">Tool:</tspan><tspan x="713" y="2273.1">Revert Workspace?</tspan></text><text text-anchor='middle' font-family="'Comic Shanns','Virgil','Segoe UI',system-ui,sans-serif" font-size="10" fill="#adb5bd"><tspan x="713" y="2295">Restaura candidato anterior</ts