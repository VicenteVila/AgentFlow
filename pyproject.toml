[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.1.0"
description = "Parse and visualize AI agent control flows as Excalidraw diagrams"
readme = {text = "Parse and visualize AI agent control flows as Excalidraw diagrams", content-type = "text/plain"}
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vicente Vila", email = "vicentevilaramirez@gmail.com" }]
keywords = ["excalidraw", "flowchart", "ai-agent", "visualization", "diagram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]
